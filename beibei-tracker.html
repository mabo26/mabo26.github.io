<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="手串記帳"/>
<link rel="manifest" href="/beibei-manifest.json">
<meta name="theme-color" content="#8b5e3c">
<title>🪬 手串記帳本</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:#f5f0ea;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:16px 14px 80px;}
h1{color:#8b5e3c;font-size:20px;font-weight:800;margin-bottom:2px;}
.sub{color:#b09070;font-size:12px;margin-bottom:18px;}
.cards{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.card{flex:1;min-width:100px;border-radius:12px;padding:12px 14px;border:1.5px solid;}
.card .lbl{font-size:11px;color:#8b7355;margin-bottom:4px;}
.card .val{font-size:18px;font-weight:800;}
.ai-banner{background:linear-gradient(135deg,#fff3e0,#ffe0b2);border:1.5px dashed #e2b96f;border-radius:14px;padding:14px 16px;cursor:pointer;margin-bottom:14px;display:flex;align-items:center;gap:12px;}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px;}
.tabs{display:flex;gap:6px;flex-wrap:wrap;}
.tab{padding:6px 12px;border-radius:20px;border:none;cursor:pointer;font-size:11px;font-weight:600;}
.tab.active{background:#8b5e3c;color:#fff;}
.tab.inactive{background:#e8ddd0;color:#8b7355;}
.export-btn{background:none;border:1px solid #c0a882;border-radius:20px;padding:5px 12px;color:#8b7355;font-size:12px;cursor:pointer;white-space:nowrap;}
.item{border-radius:14px;margin-bottom:10px;overflow:hidden;border:1.5px solid;}
.item-row{display:flex;align-items:center;padding:12px 14px;gap:12px;cursor:pointer;}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:cover;flex-shrink:0;}
.thumb-ph{width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.item-name{font-weight:600;font-size:14px;}
.item-date{font-size:12px;margin-top:2px;color:#c0a882;}
.item-price{font-weight:800;font-size:16px;margin-left:auto;flex-shrink:0;}
.badges{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;}
.badge{font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px;}
.item-detail{padding:10px 14px 14px;border-top:1px solid;}
.big-img{width:100%;border-radius:10px;max-height:280px;object-fit:contain;margin:8px 14px;width:calc(100% - 28px);}
.btn-row{display:flex;gap:8px;}
.btn{padding:10px 14px;border:none;border-radius:10px;font-weight:700;cursor:pointer;font-size:13px;flex:1;}
.add-btns{display:flex;gap:10px;margin-top:4px;}
.add-btn-main{flex:1;padding:13px;background:#8b5e3c;color:#fff;border:none;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;}
.add-btn-dep{flex:1;padding:13px;background:#fff;color:#2d7a4f;border:2px solid #2d7a4f;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;}
.form-box{background:#fff;border:1px solid #e8d5b5;border-radius:16px;padding:20px;margin-top:12px;box-shadow:0 2px 12px rgba(139,94,60,0.08);}
.form-box h3{color:#8b5e3c;font-size:15px;font-weight:700;margin-bottom:16px;}
label{display:block;color:#8b7355;font-size:12px;margin-bottom:6px;font-weight:600;}
input{width:100%;background:#faf7f4;border:1.5px solid #e0d0bc;border-radius:8px;padding:10px 12px;color:#4a3020;font-size:14px;margin-bottom:14px;-webkit-appearance:none;outline:none;}
.img-upload{border:2px dashed #e2b96f;border-radius:10px;padding:14px;text-align:center;cursor:pointer;margin-bottom:14px;background:#fffaf5;color:#b09070;font-size:13px;}
.ai-panel{background:#fff;border:1px solid #e8d5b5;border-radius:16px;padding:20px;margin-bottom:14px;box-shadow:0 2px 12px rgba(139,94,60,0.08);}
.ai-previews{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.ai-preview-wrap{position:relative;}
.ai-preview-wrap img{width:75px;height:75px;object-fit:cover;border-radius:8px;border:1.5px solid #e8d5b5;}
.ai-remove{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:#c0392b;color:#fff;border:none;cursor:pointer;font-size:11px;line-height:20px;text-align:center;padding:0;}
.ai-result-item{border-radius:8px;padding:8px 12px;margin-bottom:6px;font-size:13px;}
.empty{color:#c0a882;text-align:center;padding:30px 0;font-size:13px;}
</style>
</head>
<body>
<div style="max-width:600px;margin:0 auto;">
  <h1>🪬 手串記帳本</h1>
  <p class="sub">與貝貝的購買記錄｜幣值：人民幣</p>
  <div class="cards" id="summaryCards"></div>
  <div class="ai-banner" onclick="toggleAI()">
    <span style="font-size:26px;">📸</span>
    <div><div style="color:#8b5e3c;font-weight:700;font-size:14px;">上傳聊天截圖自動辨識</div><div style="color:#b09070;font-size:12px;margin-top:2px;">可同時上傳多張截圖，AI合併分析</div></div>
  </div>
  <div id="aiPanel"></div>
  <div class="toolbar">
    <div class="tabs" id="tabs"></div>
    <button class="export-btn" onclick="handleExport()">📥 匯出備份</button>
  </div>
  <div id="list"></div>
  <div class="add-btns">
    <button class="add-btn-main" onclick="showForm('purchase')">＋ 新增購買</button>
    <button class="add-btn-dep" onclick="showForm('deposit')">＋ 新增存款</button>
  </div>
  <div id="formBox"></div>
</div>

function loadData() {
  let saved=null;
  try { const r=localStorage.getItem(STORAGE_KEY); if(r) saved=JSON.parse(r); } catch(e){}
  if(!saved) return {deposits:DEFAULT_DEPOSITS,purchases:DEFAULT_PURCHASES};

  const pMap=new Map((saved.purchases||[]).map(p=>[p.id,p]));
  const defaultPIds=new Set(DEFAULT_PURCHASES.map(p=>p.id));
  const purchases=DEFAULT_PURCHASES.map(p=>{
    const s=pMap.get(p.id);
    return s?{...p,settled:s.settled,received:s.received}:p;
  });
  (saved.purchases||[]).forEach(p=>{ if(!defaultPIds.has(p.id)) purchases.push(p); });

  const dMap=new Map((saved.deposits||[]).map(d=>[d.id,d]));
  const defaultDIds=new Set(DEFAULT_DEPOSITS.map(d=>d.id));
  const deposits=DEFAULT_DEPOSITS.map(d=> dMap.get(d.id) || d);
  (saved.deposits||[]).forEach(d=>{ if(!defaultDIds.has(d.id)) deposits.push(d); });

  return {deposits,purchases};
}
function saveData() { try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){} }

let state=loadData(), currentTab='all', expandedId=null, bigImgId=null;
let showAIPanel=false, aiImages=[], aiLoading=false, aiResult=null, showFormType=null, formImgData=null;

const $ = id => document.getElementById(id);

function totalDeposit(){ return state.deposits.reduce((s,d)=>s+d.amount,0); }
function totalPurchase(){ return state.purchases.filter(p=>!p.settled).reduce((s,p)=>s+(p.price*p.qty),0); }
function balance(){ return totalDeposit()-totalPurchase(); }

function render(){ renderSummary(); renderTabs(); renderList(); renderAIPanel(); renderForm(); }

function renderSummary(){
  const bal=balance();
  $('summaryCards').innerHTML=`
    <div class="card" style="background:#e6f4ec;border-color:#b2ddc4;"><div class="lbl">💰 總存款</div><div class="val" style="color:#2d7a4f;">¥${totalDeposit()}</div></div>
    <div class="card" style="background:#fdecea;border-color:#f5b7b1;"><div class="lbl">🛍 未結清</div><div class="val" style="color:#c0392b;">¥${totalPurchase()}</div></div>
    <div class="card" style="background:${bal>=0?'#e8f4fd':'#fef3e2'};border-color:${bal>=0?'#aad4f0':'#fad7a0'};"><div class="lbl">${bal>=0?'✅ 餘額':'⚠️ 需補款'}</div><div class="val" style="color:${bal>=0?'#1a6fa8':'#e67e22'};">¥${bal}</div></div>`;
}

function renderTabs(){
  const tabs=[['all','全部'],['deposit','存款'],['purchase','購買'],['received','📦 已取貨'],['unreceived','⏳ 未取貨']];
  $('tabs').innerHTML=tabs.map(([k,l])=>`<button class="tab ${currentTab===k?'active':'inactive'}" onclick="setTab('${k}')">${l}</button>`).join('');
}

function setTab(t){ currentTab=t; expandedId=null; bigImgId=null; render(); }

function getItems(){
  const all=[
    ...state.deposits.map(d=>({...d,_type:'deposit',_date:d.date})),
    ...state.purchases.map(p=>({...p,_type:'purchase',_date:p.date})),
  ].sort((a,b)=>new Date(a._date)-new Date(b._date));
  if(currentTab==='deposit') return all.filter(i=>i._type==='deposit');
  if(currentTab==='purchase') return all.filter(i=>i._type==='purchase');
  if(currentTab==='received') return all.filter(i=>i._type==='purchase'&&i.received);
  if(currentTab==='unreceived') return all.filter(i=>i._type==='purchase'&&!i.received);
  return all;
}

function renderList(){
  const items=getItems(), el=$('list');
  if(!items.length){el.innerHTML='<div class="empty">暫無記錄</div>';return;}
  el.innerHTML=items.map(i=>i._type==='deposit'?renderDeposit(i):renderPurchase(i)).join('');
}

function renderDeposit(item){
  const exp=expandedId===item.id;
  return `<div class="item" style="background:#f0faf4;border-color:#b2ddc4;">
    <div class="item-row" onclick="toggleExp('${item.id}')">
      <div class="thumb-ph" style="background:#c8ecd5;">💰</div>
      <div style="flex:1;"><div class="item-name" style="color:#2d7a4f;">存款${item.note?'｜'+item.note:''}</div><div class="item-date">${item.date}</div></div>
      <div class="item-price" style="color:#2d7a4f;">+¥${item.amount}</div>
    </div>
    ${exp?`<div class="item-detail" style="border-color:#b2ddc4;">
      <div class="btn-row"><button class="btn" style="background:#fdecea;color:#c0392b;" onclick="delDeposit('${item.id}')">🗑 刪除</button></div>
    </div>`:''}
  </div>`;
}

function renderPurchase(item){
  const exp=expandedId===item.id, big=bigImgId===item.id;
  const total=item.price*item.qty, qtyStr=item.qty>1?` ×${item.qty}`:'';
  return `<div class="item" style="background:#fff;border-color:${item.settled?'#e0d5c5':'#e8d5b5'};opacity:${item.settled?0.7:1};">
    <div class="item-row" onclick="toggleExp('${item.id}')">
      ${item.img?`<img class="thumb" src="${item.img}" onclick="event.stopPropagation();toggleBig('${item.id}')">`:`<div class="thumb-ph" style="background:#f5eee5;">🪬</div>`}
      <div style="flex:1;min-width:0;">
        <div class="item-name" style="color:${item.settled?'#b09070':'#4a3020'};">${item.name}${qtyStr}</div>
        <div class="item-date">${item.date}</div>
        <div class="badges">
          ${item.settled?'<span class="badge" style="background:#e6f4ec;color:#2d7a4f;">✓ 已結清</span>':''}
          ${item.received?'<span class="badge" style="background:#e8f4fd;color:#1a6fa8;">📦 已取貨</span>':'<span class="badge" style="background:#fef3e2;color:#e67e22;">⏳ 未取貨</span>'}
        </div>
      </div>
      <div class="item-price" style="color:${item.settled?'#c0a882':'#c0392b'};">¥${total}</div>
    </div>
    ${big&&item.img?`<img class="big-img" src="${item.img}" onclick="toggleBig('${item.id}')">`:''}
    ${exp?`<div class="item-detail" style="border-color:#e8d5b5;">
      <div class="btn-row">
        ${!item.settled?`<button class="btn" style="background:#e6f4ec;color:#2d7a4f;" onclick="settle('${item.id}')">✓ 標記已結清</button>`:''}
      </div>
      <div class="btn-row" style="margin-top:6px;">
        ${!item.received
          ?`<button class="btn" style="background:#e8f4fd;color:#1a6fa8;" onclick="toggleRec('${item.id}')">📦 標記已取貨</button>`
          :`<button class="btn" style="background:#fef3e2;color:#e67e22;" onclick="toggleRec('${item.id}')">↩ 改為未取貨</button>`}
        <button class="btn" style="background:#fdecea;color:#c0392b;flex:none;padding:10px 16px;" onclick="delPurchase('${item.id}')">🗑</button>
      </div>
    </div>`:''}
  </div>`;
}

function toggleExp(id){ expandedId=expandedId===id?null:id; bigImgId=null; render(); }
function toggleBig(id){ bigImgId=bigImgId===id?null:id; render(); }
function settle(id){ state.purchases=state.purchases.map(p=>p.id===id?{...p,settled:true}:p); saveData(); render(); }
function toggleRec(id){ state.purchases=state.purchases.map(p=>p.id===id?{...p,received:!p.received}:p); saveData(); render(); }
function delDeposit(id){ if(confirm('確定刪除？')){state.deposits=state.deposits.filter(d=>d.id!==id);saveData();render();} }
function delPurchase(id){ if(confirm('確定刪除？')){state.purchases=state.purchases.filter(p=>p.id!==id);saveData();render();} }

function handleExport(){
  const data=JSON.stringify({exportDate:new Date().toISOString(),...state},null,2);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
  a.download='beibei-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}

function toggleAI(){ showAIPanel=!showAIPanel; aiImages=[]; aiResult=null; render(); }

function renderAIPanel(){
  const el=$('aiPanel');
  if(!showAIPanel){el.style.display='none';return;}
  el.style.display='block';
  el.innerHTML=`<div class="ai-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
      <div style="color:#8b5e3c;font-weight:700;font-size:15px;">📸 AI自動辨識截圖</div>
      <button onclick="toggleAI()" style="background:none;border:none;color:#b09070;cursor:pointer;font-size:20px;">✕</button>
    </div>
    ${aiImages.length?`<div class="ai-previews">${aiImages.map((img,i)=>`<div class="ai-preview-wrap"><img src="${img.preview}"><button class="ai-remove" onclick="removeAiImg(${i})">✕</button></div>`).join('')}</div>`:'' }
    <div class="img-upload" onclick="$('aiFile').click()">${aiImages.length?`已選 ${aiImages.length} 張｜繼續新增 📷`:'點擊選擇截圖（可多選）📷'}</div>
    <input id="aiFile" type="file" accept="image/*" multiple style="display:none" onchange="handleAiFiles(this)">
    ${aiImages.length&&!aiResult?`<button onclick="analyzeAI()" style="width:100%;padding:13px;background:#e2b96f;color:#fff;border:none;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;margin-bottom:10px;">${aiLoading?'⏳ AI分析中...':'🔍 開始辨識（'+aiImages.length+' 張）'}</button>`:''}
    ${aiResult?renderAiResult():''}
  </div>`;
}

function removeAiImg(i){ aiImages.splice(i,1); render(); }
function handleAiFiles(input){
  Array.from(input.files).forEach(file=>{
    const r=new FileReader();
    r.onload=e=>{aiImages.push({preview:e.target.result,mediaType:file.type||'image/jpeg'});render();};
    r.readAsDataURL(file);
  });
  input.value='';
}

async function analyzeAI(){
  if(!aiImages.length||aiLoading) return;
  aiLoading=true; aiResult=null; render();
  try{
    const blocks=aiImages.map(img=>({type:'image',source:{type:'base64',media_type:img.mediaType,data:img.preview.split(',')[1]}}));
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,messages:[{role:'user',content:[...blocks,{type:'text',text:`以上是${aiImages.length}張與貝貝的微信聊天截圖，請合併分析找出交易記錄（購買：商品名稱、單價、數量、日期；存款：金額、日期、備註）。只回傳JSON：{"deposits":[{"amount":數字,"date":"YYYY-MM-DD","note":"備註"}],"purchases":[{"name":"名稱","price":數字,"qty":數字,"date":"YYYY-MM-DD"}]}，沒找到回傳空陣列，日期只有月日用2026年。`}]}]})
    });
    const data=await res.json();
    const text=(data.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('');
    aiResult=JSON.parse(text.replace(/```json|```/g,'').trim());
  }catch(e){aiResult={error:true};}
  aiLoading=false; render();
}

function renderAiResult(){
  if(aiResult.error) return '<div style="color:#c0392b;font-size:13px;">分析失敗，請再試一次</div>';
  const deps=aiResult.deposits||[], purs=aiResult.purchases||[];
  if(!deps.length&&!purs.length) return '<div style="color:#b09070;font-size:13px;">沒有找到交易記錄</div>';
  return deps.map(d=>`<div class="ai-result-item" style="background:#e6f4ec;color:#2d7a4f;">💰 存款 ¥${d.amount} ${d.date} ${d.note||''}</div>`).join('')+
    purs.map(p=>`<div class="ai-result-item" style="background:#fdecea;color:#c0392b;">🛍 ${p.name} ¥${p.price}×${p.qty||1} ${p.date}</div>`).join('')+
    `<button onclick="confirmAI()" style="width:100%;padding:12px;background:#2d7a4f;color:#fff;border:none;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;margin-top:8px;">確認加入記錄</button>`;
}

function confirmAI(){
  const now=Date.now(), fp=aiImages[0]?.preview||null;
  (aiResult.deposits||[]).forEach((d,i)=>state.deposits.push({id:'d'+(now+i),amount:d.amount,date:d.date||new Date().toLocaleDateString('zh-TW'),note:d.note||'',img:fp}));
  (aiResult.purchases||[]).forEach((p,i)=>state.purchases.push({id:'p'+(now+100+i),name:p.name,price:p.price,qty:p.qty||1,date:p.date||new Date().toLocaleDateString('zh-TW'),img:fp,settled:false,received:false}));
  saveData(); showAIPanel=false; aiImages=[]; aiResult=null; render();
}

function showForm(type){ showFormType=type; formImgData=null; render(); setTimeout(()=>$('formBox').scrollIntoView({behavior:'smooth'}),100); }
function hideForm(){ showFormType=null; formImgData=null; render(); }

function renderForm(){
  const el=$('formBox');
  if(!showFormType){el.style.display='none';return;}
  el.style.display='block';
  const isBuy=showFormType==='purchase';
  el.innerHTML=`<div class="form-box">
    <h3>${isBuy?'🛍 新增購買記錄':'💰 新增存款記錄'}</h3>
    ${isBuy?`<label>商品名稱</label><input id="fName" placeholder="例：彩碧手串">
    <label>單價（人民幣）</label><input id="fPrice" type="number" placeholder="例：198">
    <label>數量</label><input id="fQty" type="number" value="1" min="1">`
    :`<label>備註（選填）</label><input id="fNote" placeholder="例：第二次存款">
    <label>金額（人民幣）</label><input id="fPrice" type="number" placeholder="例：368">`}
    <label>日期（選填）</label><input id="fDate" type="date">
    <label>上傳照片（選填）</label>
    <div class="img-upload" id="imgPrev" onclick="$('fImg').click()">${formImgData?`<img src="${formImgData}" style="max-height:140px;border-radius:8px;">`:'點擊上傳照片 📷'}</div>
    <input id="fImg" type="file" accept="image/*" style="display:none" onchange="prevImg(this)">
    <div class="btn-row">
      <button class="btn" style="background:${isBuy?'#8b5e3c':'#2d7a4f'};color:#fff;" onclick="submitForm()">確認新增</button>
      <button class="btn" style="background:#f0ebe4;color:#8b7355;" onclick="hideForm()">取消</button>
    </div>
  </div>`;
}

function prevImg(input){
  const file=input.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=e=>{formImgData=e.target.result;$('imgPrev').innerHTML=`<img src="${formImgData}" style="max-height:140px;border-radius:8px;">`;};
  r.readAsDataURL(file);
}

function submitForm(){
  const price=parseFloat($('fPrice')?.value); if(!price) return;
  const date=$('fDate')?.value||new Date().toLocaleDateString('zh-TW');
  const now=Date.now();
  if(showFormType==='purchase'){
    const name=$('fName')?.value; if(!name) return;
    const qty=parseInt($('fQty')?.value)||1;
    state.purchases.push({id:'p'+now,name,price,qty,date,img:formImgData||null,settled:false,received:false});
  } else {
    const note=$('fNote')?.value||'';
    state.deposits.push({id:'d'+now,amount:price,date,note,img:formImgData||null});
  }
  formImgData=null; saveData(); hideForm();
}

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/beibei-sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const newSW = reg.installing;
        newSW.addEventListener('statechange', () => {
          if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
            window.location.reload();
          }
        });
      });
    });
  });
}
</script>
</body>
</html>
